<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <meta name="robots" content="noindex" />
    <title>Como usar o RotaFibra</title>
    <link rel="icon" type="image/svg+xml" href="../icon.svg" />
    <link rel="stylesheet" href="demo.css" />
    <script>
      // mesmo tema do app (escolhido em Ajustes › Aparência), antes da primeira pintura
      try {
        var t = localStorage.getItem('rf-theme');
        document.documentElement.dataset.theme = t === 'fibra' ? 'fibra' : 'polegar';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === 'fibra') m.setAttribute('content', '#0b1f2a');
      } catch (e) { document.documentElement.dataset.theme = 'polegar'; }
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="back" id="back-app" href="../#/config" aria-label="Voltar ao app">← App</a>
      <h1 id="top-title">Como usar o RotaFibra</h1>
    </header>
    <main id="app" aria-live="polite"><p class="loading">Carregando…</p></main>
    <noscript><p class="loading">Esta página precisa de JavaScript para mostrar o passo a passo.</p></noscript>
    <script type="module" src="demo.js"></script>
  </body>
</html>
